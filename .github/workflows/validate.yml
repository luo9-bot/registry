# 注册表验证 workflow
# 放置位置：luo9-bot/registry 仓库的 .github/workflows/validate.yml
# 当收到 PR 时自动验证 registry.json 的格式和内容
name: Validate Registry

on:
  pull_request:
    paths:
      - 'registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 验证 JSON 格式
        run: |
          if ! jq empty registry.json 2>/dev/null; then
            echo "::error::registry.json 不是有效的 JSON"
            exit 1
          fi
          echo "JSON 格式验证通过"

      - name: 验证必要字段
        run: |
          # 检查顶层结构
          if ! jq -e '.plugins' registry.json > /dev/null 2>&1; then
            echo "::error::缺少 plugins 字段"
            exit 1
          fi

          # 检查每个插件的必要字段
          ERRORS=0
          for name in $(jq -r '.plugins | keys[]' registry.json); do
            plugin=$(jq ".plugins.\"$name\"" registry.json)

            # 检查 description
            if [ "$(echo "$plugin" | jq -r '.description // empty')" = "" ]; then
              echo "::error::插件 $name 缺少 description"
              ERRORS=$((ERRORS + 1))
            fi

            # 检查 repo
            if [ "$(echo "$plugin" | jq -r '.repo // empty')" = "" ]; then
              echo "::error::插件 $name 缺少 repo"
              ERRORS=$((ERRORS + 1))
            fi

            # 检查 versions 数组
            VERSIONS_LEN=$(echo "$plugin" | jq '.versions | length')
            if [ "$VERSIONS_LEN" -eq 0 ]; then
              echo "::error::插件 $name 的 versions 为空"
              ERRORS=$((ERRORS + 1))
            fi

            # 检查每个版本的字段
            for i in $(seq 0 $((VERSIONS_LEN - 1))); do
              ver=$(echo "$plugin" | jq ".versions[$i]")
              VER=$(echo "$ver" | jq -r '.version // empty')
              TAG=$(echo "$ver" | jq -r '.tag // empty')
              LINUX=$(echo "$ver" | jq -r '.assets["linux-x86_64"] // empty')
              WINDOWS=$(echo "$ver" | jq -r '.assets["windows-x86_64"] // empty')

              if [ -z "$VER" ]; then
                echo "::error::插件 $name 版本[$i] 缺少 version"
                ERRORS=$((ERRORS + 1))
              fi
              # tag 允许为空（workflow_dispatch 触发时可能无 release tag）
              if [ -z "$LINUX" ]; then
                echo "::error::插件 $name v$VER 缺少 linux-x86_64 asset"
                ERRORS=$((ERRORS + 1))
              fi
              if [ -z "$WINDOWS" ]; then
                echo "::error::插件 $name v$VER 缺少 windows-x86_64 asset"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::共 $ERRORS 个验证错误"
            exit 1
          fi
          echo "必要字段验证通过"

      - name: 验证无重复版本
        run: |
          ERRORS=0
          for name in $(jq -r '.plugins | keys[]' registry.json); do
            DUPES=$(jq ".plugins.\"$name\".versions | group_by(.version) | map(select(length > 1)) | map(.[0].version) | length" registry.json)
            if [ "$DUPES" -gt 0 ]; then
              echo "::error::插件 $name 存在重复版本"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "版本唯一性验证通过"

      - name: 输出验证结果
        run: |
          echo "### 注册表验证结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PLUGIN_COUNT=$(jq '.plugins | length' registry.json)
          echo "- 插件数量: $PLUGIN_COUNT" >> $GITHUB_STEP_SUMMARY
          for name in $(jq -r '.plugins | keys[]' registry.json); do
            DESC=$(jq -r ".plugins.\"$name\".description" registry.json)
            LATEST=$(jq -r ".plugins.\"$name\".versions[0].version" registry.json)
            echo "- **$name**: $DESC (最新: v$LATEST)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**验证通过**" >> $GITHUB_STEP_SUMMARY
